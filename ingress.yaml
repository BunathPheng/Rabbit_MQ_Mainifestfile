apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: rabbitmq-letsencrypt
  namespace: rabbitmq
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: bunathpheng4@gmail.com
    privateKeySecretRef:
      name: rabbitmq-letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rabbitmq-management
  namespace: rabbitmq
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    cert-manager.io/issuer: rabbitmq-letsencrypt
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: rabbitmq
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rabbitmq.smartops.space
      secretName: rabbitmq-management-tls
  rules:
    - host: rabbitmq.smartops.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rabbitmq
                port:
                  name: management
